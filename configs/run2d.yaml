
stage: 2D_CT

grid:
  Nr: 128
  Nz: 256
  Rmax: 0.01
  Zmax: 0.10
  ghost: 2

time:
  t_end: 2.0e-4
  cfl: 0.4
  dt_min: 1.0e-9
  output_every: 50

physics:
  gamma: 1.6666666667
  eta: 1.0e-6
  Bz0: 0.5
  density0: 1.0
  pressure0: 1.0e-2

equilibrium_type: bennett
I0: 0.15
a:  0.35
p0: 1.0e-2
rho0: 1.0

# CT toy velocity
vel_amp: 500.0     # m/s equivalent (units-agnostic here)
vel_type: solid    # solid | shear
eta_ct: 0.0

io:
  out_dir: ./data
