# Plantilla: el script sustituye ${Bz0} y ${OUT}
stage: 2D_MHD_TOY

# Malla / dominio (más largo en z para que “respire”)
Nr: 128
Nz: 512
Rmax: 0.02
Zmax: 0.20
ghost: 3

# Tiempo / salida
t_end: 6.0e-4
cfl: 0.6
dt_min: 1.0e-10
output_every: 50
out_dir: "${OUT}"

# Física + estabilidad
gamma: 1.6666666667
limiter: mc
eta_ct: 1e-4
vmax_guard: 500
dt_max: 2.5e-8
diag_every: 25

# Problema z-pinch
problem: pinch_bennett
Bz0: ${Bz0}

# BCs
bc_z: periodic

# Siembra modal (igual que arriba)
modes:
  enable: true
  field: vr
  m: 1
  k: 62.8318530718
  eps: 1.0e-3
  r0_frac: 0.30
  sigma_frac: 0.05
  seed_vr: true
  seed_bth: true

