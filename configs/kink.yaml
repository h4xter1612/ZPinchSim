# === Z-Pinch: KINK (m=1) scenario, with 2.5D outputs (m=1 projections written) ===
stage: 2D_MHD_TOY
out_dir: ./data/kink_m1_2p5d

# --- Grid / domain ---
Nr: 128
Nz: 256
ghost: 2
Rmax: 0.02
Zmax: 0.10          # n=1 fundamental -> k = 2π/Zmax ≈ 62.8318530718

# --- Time / I/O / stability ---
t_end: 7.0e-5
cfl: 0.25
dt_max: 2.0e-08
output_every: 20
diag_every: 20
vmax_guard: 1200

# --- Base physics / numerics ---
gamma: 1.6666666667
Bz0: 0.01            # stronger than sausage case; typical for kink tests
eta_ct: 1.0e-3
limiter: mc
bc_z: periodic
problem: pinch_bennett

# --- Optional axial flow (off by default) ---
flow.type: off
flow.v0: 0.0
flow.r0_frac: 0.30
flow.sigma_frac: 0.12

# --- Seeding: KINK (m=1) ---
modes.enable: true
modes.m: 1
modes.k: 62.8318530718   # 2π/Zmax with Zmax=0.10
modes.eps: 3.0e-3
modes.r0_frac: 0.30
modes.seed_vr: true
modes.seed_bth: true

# --- Modal diagnostics written by the C++ code (CSV in debug/) ---
diag.mode_amp: true
diag.k_diag: 62.8318530718
diag.amp_from: pressure   # "pressure" | "density"

